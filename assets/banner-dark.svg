<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="lowriskbtc: trading systems, automation and APIs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f1f5f9; letter-spacing: -1px; }
      .sub   { font: 400 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
      .chip  { font: 600 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e2e8f0; }
      .line  { fill: none; stroke: url(#accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .draw  { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.2s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- price-chart flourish on the right -->
  <polyline class="line draw" points="690,232 735,214 770,224 812,180 850,192 892,150 930,164 968,118 1006,132 1046,88 1086,104 1130,62"/>
  <circle cx="1130" cy="62" r="6" fill="#a78bfa"/>
  <circle cx="1130" cy="62" r="14" fill="#a78bfa" fill-opacity="0.18"/>

  <text x="64" y="128" class="title">lowriskbtc</text>
  <rect x="66" y="148" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="64" y="196" class="sub">Trading systems, automation and APIs in Python</text>

  <g transform="translate(64,224)">
    <rect width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="66" y="23" text-anchor="middle" class="chip">Tested in CI</text>
    <rect x="146" width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#67e8f9" stroke-opacity="0.45"/>
    <text x="210" y="23" text-anchor="middle" class="chip">Paper-first</text>
    <rect x="288" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="363" y="23" text-anchor="middle" class="chip">Security-minded</text>
  </g>
</svg>
